name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Releases created inside a workflow do not trigger "on: release"
      # workflows, so the tap is updated here, in the same run.
      - name: Update Homebrew formula
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: macchiato
          homebrew-tap: MauroCicerchia/homebrew-tap
          tag-name: ${{ steps.release.outputs.tag_name }}
          download-url: https://github.com/MauroCicerchia/macchiato/archive/refs/tags/${{ steps.release.outputs.tag_name }}.tar.gz
          create-pullrequest: false
          create-branch: false
        env:
          COMMITTER_TOKEN: ${{ secrets.RELEASE_TOKEN }}
