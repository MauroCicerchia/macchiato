name: Feature request
description: Suggest an idea for macchiato.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
      description: Note that macchiato forwards every argument to caffeinate and adds no options of its own.
    validations:
      required: true
